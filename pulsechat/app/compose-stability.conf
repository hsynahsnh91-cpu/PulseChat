// Compose compiler stability promises (wired in app/build.gradle.kts via composeCompiler {}).
// Only list types that are truly immutable value holders (all vals, value-based equals, contents
// never mutated after creation). Room entities qualify: Room materialises a fresh instance per
// query and the app never mutates them in place, so a composable receiving one can safely skip
// when the instance is equals-identical. BubbleCallbacks qualifies because ChatScreen creates it
// once per ViewModel with remember(vm).
com.example.data.model.**
com.example.ui.chat.BubbleCallbacks
com.example.ui.chat.MessageItem
com.example.ui.chat.DayItem
com.example.ui.chat.UnreadItem
