name: Android CI

# Builds the PulseChat Android project (located in ./pulsechat), runs JVM unit tests and
# verifies that the release variant still compiles/packages with the existing signing setup.
#
# CI-only artifacts (debug keystore, throw-away upload key, empty .env) are generated on the
# runner and are never committed. Real release signing keeps using KEYSTORE_PATH /
# STORE_PASSWORD / KEY_PASSWORD exactly as configured in app/build.gradle.kts.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pulsechat
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.3.1 (matches gradle-wrapper.properties)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare CI-only signing material and secrets file
        run: |
          # signingConfigs.debugConfig expects ${rootDir}/debug.keystore (not committed).
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          # Secrets Gradle Plugin reads .env (falls back to .env.example). Never commit .env.
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then cp .env.example .env; else printf 'GEMINI_API_KEY=\nAI_API_KEY=\n' > .env; fi
          fi

      - name: Assemble debug
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: JVM unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Assemble release (throw-away upload key, verifies release config still builds)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-upload.jks" -storepass ci-store-pass \
            -alias upload -keypass ci-store-pass -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=PulseChat CI,O=CI,C=US"
          KEYSTORE_PATH="$RUNNER_TEMP/ci-upload.jks" STORE_PASSWORD=ci-store-pass KEY_PASSWORD=ci-store-pass \
            gradle --no-daemon assembleRelease

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            pulsechat/app/build/reports/tests/
            pulsechat/app/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pulsechat-debug-apk
          path: pulsechat/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
